name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            scripts/mihomo/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.24
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Generate Wails bindings
        run: wails3 generate bindings -ts -i

      - name: Check frontend types
        run: npm --prefix frontend run typecheck

      - name: Build frontend for Go embedding
        run: npm --prefix frontend run build

      - name: Build security-maintained core
        run: sh scripts/prepare-mihomo.sh

      - name: Prepare GeoIP database
        run: sh scripts/prepare-geodata.sh

      - name: Run Go and real-core regression tests
        run: VELA_TEST_MIHOMO="$PWD/build/resources/mihomo" go test -race ./...

      - name: Scan application and bundled core
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode=binary build/resources/mihomo
          npm --prefix frontend audit

      - name: Vet Go code
        run: go vet ./...
